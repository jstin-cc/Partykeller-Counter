<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SV Partykeller – Scoreboard</title>
<script>document.documentElement.dataset.area = location.pathname.startsWith('/youngstars') ? 'youngstars' : 'partykeller';</script>
<link rel="icon" href="assets/cones-flat.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="assets/icon-192.png">

<style>
  :root {
    --bg-lo: oklch(0.11 0.03 155);
    --surface-hi: oklch(0.30 0.022 160 / 0.58);
  }
  html, body { height: 100%; }
  body { overflow: hidden; }
  .tv {
    width: 100vw;
    height: 100vh;
    background: var(--bg);
    overflow: hidden;
    position: relative;
  }
  /* Design-Bühne: das Board ist auf 1080 Design-Pixel Höhe ausgelegt und wird
     als Ganzes per transform auf die echte Fensterhöhe skaliert. So sieht das
     Layout auf jeder Auflösung/Zoomstufe identisch aus (statt dass feste
     Pixelgrößen bei kleinen Fenstern die Tabelle zerquetschen). Die Breite
     bleibt fluid (min. 1440 Design-Pixel), Extra-Höhe bei schmalen Formaten
     bekommt die Tabelle über flex. */
  .stage {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
    overflow: hidden;
  }
  .tv-mark {
    position: absolute;
    background: url('assets/zapfen-bg.svg') no-repeat center / contain;
  }
  .podium-card {
    background: linear-gradient(180deg, var(--surface-hi), var(--surface));
    backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border: 1px solid var(--glass-edge);
    border-radius: var(--radius-lg);
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
  }
  .podium-badge {
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bitter', serif;
    font-weight: 800;
    color: var(--bg);
    z-index: 1;
  }
  /* Rangliste ab Platz 4: großes gerundetes Panel, darin einzeln
     abgerundete Zeilen, die als Fenster durchscrollen. */
  .table-panel {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    background: var(--surface-alt);
    border-radius: var(--radius-lg);
    padding: 12px 14px;
    overflow: hidden;
  }
  .rest-viewport { flex: 1; min-height: 0; overflow: hidden; position: relative; }
  /* Wenn rotiert wird, läuft unten eine angeschnittene Zeile mit — weich
     ausblenden statt hart abschneiden */
  .rest-viewport.scrollable {
    -webkit-mask-image: linear-gradient(to bottom, black calc(100% - 48px), transparent);
    mask-image: linear-gradient(to bottom, black calc(100% - 48px), transparent);
  }
  .rest-track { position: absolute; left: 0; right: 0; top: 0; display: flex; flex-direction: column; gap: 8px; will-change: transform; }
  .row {
    display: flex;
    align-items: center;
    gap: 28px;
    padding: 0 24px;
    flex: 0 0 auto;
    position: relative;
    border: 1px solid var(--glass-edge);
    border-radius: var(--radius);
    backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
  }
  .row:nth-child(odd) { background: var(--surface); }
  .row:nth-child(even) { background: var(--surface-alt); }
  /* kurzes Aufleuchten der Zeile, wenn sich ihr Wert erhöht */
  .row.pk-rowflash::after {
    content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    animation: pk-rowflash 0.85s ease;
  }
  @keyframes pk-rowflash {
    0%   { background: oklch(0.80 0.15 83 / 0); }
    30%  { background: oklch(0.80 0.15 83 / 0.20); }
    100% { background: oklch(0.80 0.15 83 / 0); }
  }
  @media (prefers-reduced-motion: reduce) { .row.pk-rowflash::after { animation: none; } }
  .col-rank { width: 70px; font-family:'Bitter',serif; font-weight:700; font-size:24px; color:var(--ink-muted); font-variant-numeric:tabular-nums; }
  .col-name { flex: 1; font-family:'Bitter',serif; font-weight:700; font-size:28px; }
  .col-beer { width:120px; text-align:right; font-family:'Bitter',serif; font-weight:700; font-size:28px; color:var(--amber); font-variant-numeric:tabular-nums; }
  .col-shot { width:120px; text-align:right; font-family:'Bitter',serif; font-weight:700; font-size:28px; color:var(--brick); font-variant-numeric:tabular-nums; }
  .col-mix { width:120px; text-align:right; font-family:'Bitter',serif; font-weight:700; font-size:28px; color:var(--mix); font-variant-numeric:tabular-nums; }
  .col-total { width:140px; text-align:right; font-family:'Bitter',serif; font-weight:800; font-size:34px; color:var(--gold); text-shadow:0 0 10px oklch(0.80 0.15 83 / 0.25); font-variant-numeric:tabular-nums; }
  /* Rekordkurs (Bier-Pace): glüht auf, wenn der Abend schneller läuft als der
     Rekord-Abend zur gleichen Uhrzeit */
  .pace-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    padding: 4px 14px;
    border-radius: 999px;
    border: 1px solid oklch(0.80 0.15 83 / 0.55);
    background: oklch(0.80 0.15 83 / 0.12);
    color: var(--gold);
    font-family: 'Bitter', serif;
    font-weight: 800;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    animation: pk-paceglow 2.4s ease-in-out infinite;
  }
  @keyframes pk-paceglow {
    0%, 100% { box-shadow: 0 0 4px oklch(0.80 0.15 83 / 0.15); }
    50%      { box-shadow: 0 0 18px oklch(0.80 0.15 83 / 0.45); }
  }
  @media (prefers-reduced-motion: reduce) { .pace-pill { animation: none; } }
</style>
</head>
<body>

<script type="module">
import { AREA } from './js/area.js';
import { connectState } from './js/ws-client.js';

const $ = (id) => document.getElementById(id);

// --- Design-Bühne auf Fenstergröße skalieren (siehe CSS .stage) ---
// Höhe fest 1080 Design-Pixel, Breite fluid ab 1440; bei schmaleren Formaten
// (z. B. 4:3) wächst die Bühnenhöhe und die Rangliste zeigt mehr Zeilen.
const DESIGN_H = 1080;
const MIN_W = 1440;

function fitStage() {
  const scale = Math.min(window.innerHeight / DESIGN_H, window.innerWidth / MIN_W);
  const stage = $('stage');
  stage.style.width = `${window.innerWidth / scale}px`;
  stage.style.height = `${window.innerHeight / scale}px`;
  stage.style.transform = `scale(${scale})`;
}
fitStage();
window.addEventListener('resize', fitStage);

// --- QR-Code zum Beitreten ---
// Zieladresse ist die vom Admin gesetzte joinUrl; ohne Vorgabe die
// Startseite dieses Servers (auf dem Pi z. B. http://partykeller.local:3000/).
let currentQrUrl = null;
function renderQr(url) {
  if (url === currentQrUrl) return;
  currentQrUrl = url;
  const qr = qrcode(0, 'M');
  qr.addData(url);
  qr.make();
  $('qr').innerHTML = qr.createSvgTag({ cellSize: 3, margin: 2, scalable: true });
  $('qr').firstElementChild.style.cssText = 'width:100%;height:100%;display:block;';
}

// kurze Animationen (Reflow erzwingt Neustart)
function pop(el) { el.classList.remove('pk-pop'); void el.offsetWidth; el.classList.add('pk-pop'); }
function flash(el) { el.classList.remove('pk-flash'); void el.offsetWidth; el.classList.add('pk-flash'); }

const prevPod = { 1: null, 2: null, 3: null };

function fillPodium(el, p, slot) {
  el.hidden = !p;
  if (!p) { prevPod[slot] = null; return; }
  const totalEl = el.querySelector('[data-f=total]');
  el.querySelector('[data-f=name]').textContent = p.name;
  totalEl.textContent = p.total;
  el.querySelector('[data-f=beers]').textContent = `${p.beers} Bier`;
  el.querySelector('[data-f=shots]').textContent = `${p.shots} Shots`;
  el.querySelector('[data-f=mixes]').textContent = `${p.mixes} Mische`;

  const prev = prevPod[slot];
  if (!modeSwitching && prev && prev.id === p.id && p.total > prev.total) {
    pop(totalEl);                                    // gleicher Mensch, mehr Getränke
  } else if (!modeSwitching && prev && prev.id !== p.id) {
    flash(el.querySelector('.podium-card'));         // neue:r auf diesem Podestplatz
  }
  prevPod[slot] = { id: p.id, total: p.total };
}

// --- Rangliste ab Platz 4 ---
// Feste Zeilenhöhe im Design-Raster; wie viele Zeilen sichtbar sind, ergibt
// sich aus dem verfügbaren Platz (füllt die Tabelle immer komplett). Passen
// nicht alle rein, scrollt das Fenster Zeile für Zeile nach unten; unten
// angekommen springt es schnell wieder ganz nach oben und beginnt von vorne.
const ROW_H = 64;         // Zeilenhöhe in Design-Pixeln
const GAP = 8;            // px zwischen den Zeilen (muss zu .rest-track passen)
const SCROLL_MS = 650;    // sanft eine Zeile weiter
const RESET_MS = 900;     // schnell zurück nach oben

// Verweildauer pro Schritt: im Admin einstellbar (setScrollSpeed), kommt im State
let stepMs = 3200;

let others = [];          // Spieler ab Platz 4 (aktuellster State)
let prevOthers = [];      // vorheriger 4+-Stand (Diff: Umsortierung erkennen)
let prevVals = {};        // id -> {beers,shots,mixes,total} (Pop bei Anstieg)
let track = null;
let pos = 0;
let maxPos = 0;
let scrollTimer = null;
let modeSwitching = false; // beim Moduswechsel keine Zeilen-Animation (Slide übernimmt)

// Wie viele Zeilen passen aktuell komplett ins Ranglisten-Fenster?
function visibleRows() {
  return Math.max(1, Math.floor(($('rest').clientHeight + GAP) / (ROW_H + GAP)));
}

function popEl(el) { el.classList.remove('pk-pop'); void el.offsetWidth; el.classList.add('pk-pop'); }
function rowFlash(el) { el.classList.remove('pk-rowflash'); void el.offsetWidth; el.classList.add('pk-rowflash'); }

// prev = Vorwerte desselben Spielers; gestiegene Zähler bekommen direkt „Pop",
// die ganze Zeile leuchtet kurz auf.
function buildRow(p, prev) {
  const row = document.createElement('div');
  row.className = 'row';
  row.dataset.id = p.id;
  for (const [cls, text, key] of [
    ['col-rank', p.rank, null],
    ['col-name', p.name, null],
    ['col-beer', p.beers, 'beers'],
    ['col-shot', p.shots, 'shots'],
    ['col-mix', p.mixes, 'mixes'],
    ['col-total', p.total, 'total'],
  ]) {
    const cell = document.createElement('div');
    cell.className = cls;
    cell.textContent = text;
    if (key && prev && p[key] > prev[key]) cell.classList.add('pk-pop');
    row.appendChild(cell);
  }
  if (prev && p.total > prev.total) row.classList.add('pk-rowflash');
  return row;
}

function stopScroll() {
  if (scrollTimer) { clearInterval(scrollTimer); scrollTimer = null; }
}

function scrollStep() {
  if (maxPos <= 0 || !track) return;
  if (pos >= maxPos) {
    // Ende erreicht: schnell zurück nach oben und von vorne
    track.style.transition = `transform ${RESET_MS}ms ease-in-out`;
    pos = 0;
  } else {
    track.style.transition = `transform ${SCROLL_MS}ms ease`;
    pos += 1;
  }
  track.style.transform = `translateY(${-pos * (ROW_H + GAP)}px)`;
}

// Rotation passend zum aktuellen Stand (Zeilenzahl, Platz) starten/stoppen
function syncScroll() {
  maxPos = Math.max(0, others.length - visibleRows());
  if (pos > maxPos) {
    pos = Math.min(pos, maxPos);
    if (track) {
      track.style.transition = 'none';
      track.style.transform = `translateY(${-pos * (ROW_H + GAP)}px)`;
      void track.offsetWidth;
    }
  }
  if (maxPos > 0 && !scrollTimer) scrollTimer = setInterval(scrollStep, stepMs);
  if (maxPos <= 0) stopScroll();
  $('rest').classList.toggle('scrollable', maxPos > 0);
}

function sameIds(a, b) {
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) if (a[i].id !== b[i].id) return false;
  return true;
}

// Reihenfolge unverändert: Werte in den vorhandenen Zeilen aktualisieren, ohne
// neu aufzubauen. Die Scrollposition bleibt erhalten, gestiegene Zähler poppen.
function updateRowsInPlace(list) {
  for (let i = 0; i < list.length; i++) {
    const p = list[i];
    const el = track.children[i];
    if (!el) continue;
    const prev = prevVals[p.id];
    const set = (cls, val, key) => {
      const cell = el.querySelector('.' + cls);
      if (cell.textContent !== String(val)) cell.textContent = val;
      if (key && prev && val > prev[key]) popEl(cell);
    };
    set('col-rank', p.rank);
    set('col-name', p.name);
    set('col-beer', p.beers, 'beers');
    set('col-shot', p.shots, 'shots');
    set('col-mix', p.mixes, 'mixes');
    set('col-total', p.total, 'total');
    if (prev && p.total > prev.total) rowFlash(el);
  }
}

// Reihenfolge/Menge geändert: neu aufbauen. Bei Umsortierung gleiten die Zeilen
// per FLIP von ihrer alten an die neue Position.
function rebuildRest(animate) {
  const viewport = $('rest');
  const oldTop = {};
  if (track) for (const r of track.children) oldTop[r.dataset.id] = r.getBoundingClientRect().top;

  stopScroll();
  viewport.textContent = '';
  pos = 0;
  if (others.length === 0) { track = null; return; }

  track = document.createElement('div');
  track.className = 'rest-track';
  for (const p of others) track.appendChild(buildRow(p, modeSwitching ? null : prevVals[p.id]));
  viewport.appendChild(track);

  // feste Zeilenhöhe im Design-Raster: bleibt auf jeder Auflösung gleich,
  // nur die Anzahl sichtbarer Zeilen variiert mit dem Platz
  for (const r of track.children) r.style.height = `${ROW_H}px`;
  track.style.transition = 'none';
  track.style.transform = 'translateY(0)';

  if (animate && !modeSwitching) {
    for (const r of track.children) {
      const id = r.dataset.id;
      const newTop = r.getBoundingClientRect().top;
      if (oldTop[id] != null) {
        const delta = oldTop[id] - newTop;
        if (delta) {
          r.style.transform = `translateY(${delta}px)`;
          requestAnimationFrame(() => {
            r.style.transition = 'transform 0.55s cubic-bezier(0.2, 0.8, 0.2, 1)';
            r.style.transform = 'translateY(0)';
          });
        }
      } else {
        r.style.opacity = '0';               // neue Zeile: sanft einblenden
        requestAnimationFrame(() => { r.style.transition = 'opacity 0.55s ease'; r.style.opacity = '1'; });
      }
    }
  }

  syncScroll();
}

// Ändert sich der verfügbare Platz (Fenster-Resize, Font-Swap, anderes
// Seitenformat), passt sich nur die Anzahl sichtbarer Zeilen an — Rotation
// und Scrollposition werden dazu neu ausgerichtet.
new ResizeObserver(() => { if (track) syncScroll(); }).observe($('rest'));

// Geschwindigkeit geändert (Admin): laufende Rotation mit neuem Takt fortsetzen
function applyScrollSpeed(seconds) {
  const ms = Math.round((Number(seconds) || 3.2) * 1000);
  if (ms === stepMs) return;
  stepMs = ms;
  if (scrollTimer) {
    clearInterval(scrollTimer);
    scrollTimer = setInterval(scrollStep, stepMs);
  }
}

// Einstieg: In-Place-Update bei gleicher Reihenfolge, sonst Neuaufbau mit FLIP.
function updateRest(newOthers) {
  const reorder = modeSwitching || !track || !sameIds(prevOthers, newOthers);
  others = newOthers;
  if (reorder) rebuildRest(prevOthers.length > 0);
  else updateRowsInPlace(newOthers);

  prevVals = {};
  for (const p of newOthers) prevVals[p.id] = { beers: p.beers, shots: p.shots, mixes: p.mixes, total: p.total };
  prevOthers = newOthers;
}

// --- Board-Modus (All-Time / Heute / Archiv-Abend), im Admin umschaltbar ---
let currentMode = null;
let currentDay = null;   // bei Modus 'archive': der gezeigte Party-Tag

function metricsFor(p, mode) {
  return mode === 'today'
    ? { beers: p.beersToday, shots: p.shotsToday, mixes: p.mixesToday,
        total: p.beersToday + p.shotsToday + p.mixesToday, ts: p.lastDrinkTsToday }
    : { beers: p.beers, shots: p.shots, mixes: p.mixes, total: p.total, ts: p.lastDrinkTs };
}

// Modus bestimmt, wer auf dem Board steht:
//  - alltime: alle mit Haken im Admin (der Haken gilt nur für die Gesamtansicht)
//  - today:   alle, die heute mindestens ein Getränk geloggt haben
function boardRows(players, mode) {
  const rows = players
    .map((p) => ({ id: p.id, name: p.name, hidden: p.hidden, ...metricsFor(p, mode) }))
    .filter((r) => (mode === 'today' ? r.total > 0 : !r.hidden));
  // Tiebreak bei Punktegleichstand: zuerst nach Uhrzeit (wer zuerst auf dem
  // Stand war), Name nur noch als letzter Fallback (z. B. beide 0 Getränke).
  rows.sort((a, b) =>
    b.total - a.total ||
    (a.ts ?? Infinity) - (b.ts ?? Infinity) ||
    a.name.localeCompare(b.name, 'de')
  );
  rows.forEach((r, i) => { r.rank = i + 1; });
  return rows;
}

function applyState(state, mode) {
  // Archiv-Modus: der Server liefert die Werte des gewählten Party-Tags fertig
  // sortiert mit (archivePlayers); Live-Modi rechnen wie gehabt aus players.
  const rows = mode === 'archive'
    ? (state.archivePlayers ?? []).map((p, i) => ({ ...p, rank: i + 1 }))
    : boardRows(state.players, mode);

  $('board-subtitle').textContent =
    mode === 'today' ? 'Rangliste heute'
    : mode === 'archive' ? `Abend vom ${fmtDay(state.boardDay)}`
    : 'All-Time Rangliste';
  $('participant-count').textContent =
    mode === 'today' ? `${rows.length} heute dabei`
    : mode === 'archive' ? `${rows.length} waren dabei`
    : `${rows.length} Teilnehmer`;
  const beers = rows.reduce((s, r) => s + r.beers, 0);
  const shots = rows.reduce((s, r) => s + r.shots, 0);
  const mixes = rows.reduce((s, r) => s + r.mixes, 0);
  const suffix = mode === 'today' ? 'heute' : mode === 'archive' ? 'an dem Abend' : 'gesamt';
  $('totals').textContent = `${beers} Bier · ${shots} Shots · ${mixes} Mische ${suffix}`;

  fillPodium($('pod-1'), rows[0], 1);
  fillPodium($('pod-2'), rows[1], 2);
  fillPodium($('pod-3'), rows[2], 3);

  updateRest(rows.slice(3));
  updateFacts(state.players.filter((p) => !p.hidden), state.records, state.customFacts, state.funStats);
  updatePace(state.funStats?.pace, mode);
}

// --- Rekordkurs (Bier-Pace): Pill im Kopf, sobald der Abend vor dem besten
// bisherigen Abend liegt (ab 3 Getränken, nicht im Archiv-Modus). Zwischen
// zwei Getränken „altert" der Vergleich — deshalb unten der 5-Minuten-Refresh.
function updatePace(pace, mode) {
  const el = $('pace-pill');
  const show = mode !== 'archive' && !!pace && pace.onPace && pace.todayTotal >= 3;
  el.hidden = !show;
  if (show) {
    el.textContent = `🔥 Auf Rekordkurs! ${pace.todayTotal} : ${pace.recordAtSameTime} vs. ${fmtDay(pace.recordDay)}`;
  }
}

setInterval(async () => {
  try {
    const res = await fetch(`${AREA.base}/api/state`);
    if (!res.ok) return;
    const s = await res.json();
    updatePace(s.funStats?.pace, currentMode);
  } catch { /* nächster Broadcast/Refresh richtet es */ }
}, 5 * 60 * 1000);

// Moduswechsel: das ganze Board fährt raus und das neue fährt wieder ein
function slideSwap(rebuild) {
  const board = $('board');
  board.style.transition = 'transform 0.32s ease, opacity 0.32s ease';
  board.style.transform = 'translateX(-70px)';
  board.style.opacity = '0';
  setTimeout(() => {
    modeSwitching = true;
    rebuild();
    modeSwitching = false;
    board.style.transition = 'none';
    board.style.transform = 'translateX(70px)';
    void board.offsetWidth;
    board.style.transition = 'transform 0.32s ease, opacity 0.32s ease';
    board.style.transform = 'translateX(0)';
    board.style.opacity = '1';
  }, 340);
}

connectState({
  onState(state) {
    const { joinUrl, boardMode } = state;
    renderQr((joinUrl && joinUrl.length ? joinUrl : location.origin + AREA.base + '/'));
    applyScrollSpeed(state.scrollSeconds);
    applyFunfactSpeed(state.funfactSeconds);
    const mode = boardMode === 'today' ? 'today'
      : (boardMode === 'archive' && state.boardDay) ? 'archive'
      : 'alltime';

    // Slide auch beim Wechsel zwischen zwei Archiv-Abenden
    const switched = currentMode !== null &&
      (mode !== currentMode || (mode === 'archive' && state.boardDay !== currentDay));
    if (switched) {
      slideSwap(() => { currentMode = mode; currentDay = state.boardDay ?? null; applyState(state, mode); });
    } else {
      currentMode = mode;
      currentDay = state.boardDay ?? null;
      applyState(state, mode);
    }
  },
});

// --- Fun-Facts (live) ---
// Jeder Eintrag ist { title, text }: berechnete Facts (Rekorde, Tages-
// Bestleistungen) plus die vom Admin gepflegten eigenen Meldungen.
// „Heute" = Party-Tag 06:00–05:59 (kommt schon aggregiert vom Server).
const FUNFACT_FALLBACK = { title: 'Fun Fact', text: 'Heute noch nichts getrunken – auf geht’s!' };
let facts = [];
let factIdx = 0;
const factEl = $('funfact-text');
const factTitleEl = $('funfact-title');

function leaderBy(players, key) {
  let best = null;
  for (const p of players) {
    const v = p[key] || 0;
    if (v > 0 && (!best || v > (best[key] || 0))) best = p;
  }
  return best;
}

// '2026-09-25' -> '25.09.2026'
function fmtDay(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}.${m}.${y}`;
}

function computeFacts(players, records, customFacts, funStats) {
  const out = [];
  const fact = (text) => out.push({ title: 'Fun Fact', text });

  // All-Time-Rekorde: meiste Getränke an einem einzelnen Abend, schön formuliert
  if (records) {
    if (records.beer) fact(`Bier-Rekord: Die meisten Biere an einem Abend hat ${records.beer.name} am ${fmtDay(records.beer.day)} geschafft – ganze ${records.beer.n} Stück.`);
    if (records.shot) fact(`Shot-Rekord: ${records.shot.name} kippte am ${fmtDay(records.shot.day)} sagenhafte ${records.shot.n} Shots an einem Abend.`);
    if (records.mix) fact(`Mische-Rekord: ${records.mix.name} mixte am ${fmtDay(records.mix.day)} ${records.mix.n} Mischgetränke an einem Abend.`);
  }

  // Eigene Meldungen aus dem Admin (mit eigenem Titel)
  for (const f of customFacts ?? []) out.push({ title: f.title, text: f.text });

  // Tages-Bestleistungen (heute)
  const b = leaderBy(players, 'beersToday');
  if (b) fact(`Bier-König des Abends: ${b.name} mit ${b.beersToday} Bier.`);
  const s = leaderBy(players, 'shotsToday');
  if (s) fact(`Shot-Meister des Abends: ${s.name} mit ${s.shotsToday} Shots.`);
  const m = leaderBy(players, 'mixesToday');
  if (m) fact(`Misch-Meister des Abends: ${m.name} mit ${m.mixesToday} Mischen.`);
  let top = null, topN = 0;
  for (const p of players) {
    const n = (p.beersToday || 0) + (p.shotsToday || 0) + (p.mixesToday || 0);
    if (n > topN) { topN = n; top = p; }
  }
  if (top) fact(`Fleißigste:r heute: ${top.name} mit ${topN} Getränken.`);

  // Statistik-Facts aus dem Archiv (Server: funStats); erst zeigen, wenn die
  // Zahlen etwas hergeben, damit das Band nicht mit Banalem langweilt.
  const fs = funStats ?? {};
  if (fs.firstToday) {
    const t = new Date(fs.firstToday.ts);
    const hm = `${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`;
    fact(`Frühstart: Das erste Getränk heute ging um ${hm} Uhr an ${fs.firstToday.name}.`);
  }
  if (fs.topHourToday && fs.topHourToday.n >= 3) {
    fact(`Durstigste Stunde heute: zwischen ${fs.topHourToday.hour} und ${(fs.topHourToday.hour + 1) % 24} Uhr – ${fs.topHourToday.n} Getränke.`);
  }
  if (fs.recordNight && fs.nights >= 2) {
    fact(`Rekord-Abend: Am ${fmtDay(fs.recordNight.day)} flossen zusammen ${fs.recordNight.total} Getränke.`);
  }
  if (fs.pace && fs.pace.onPace && fs.pace.todayTotal >= 3) {
    fact(`Rekordkurs: Schon ${fs.pace.todayTotal} Getränke heute – der Rekord-Abend vom ${fmtDay(fs.pace.recordDay)} stand um diese Uhrzeit erst bei ${fs.pace.recordAtSameTime}.`);
  }
  if (fs.regular && fs.regular.nights >= 3) {
    fact(`Stammgast: ${fs.regular.name} war schon an ${fs.regular.nights} Abenden dabei.`);
  }
  if (fs.topWinner && fs.topWinner.wins >= 2) {
    fact(`Seriensieger: ${fs.topWinner.name} hat schon ${fs.topWinner.wins} Abende gewonnen.`);
  }
  if (fs.nights >= 2) {
    const beers = players.reduce((sum, p) => sum + (p.beers || 0), 0);
    const shots = players.reduce((sum, p) => sum + (p.shots || 0), 0);
    const mixes = players.reduce((sum, p) => sum + (p.mixes || 0), 0);
    fact(`Gesamtbilanz: ${beers} Bier, ${shots} Shots und ${mixes} Mischen in ${fs.nights} Abenden.`);
  }
  return out;
}

function currentFactList() {
  return facts.length ? facts : [FUNFACT_FALLBACK];
}

function showFact(f) {
  factTitleEl.textContent = f.title;
  factEl.textContent = f.text;
}

function updateFacts(players, records, customFacts, funStats) {
  facts = computeFacts(players, records, customFacts, funStats);
  const list = currentFactList();
  factIdx %= list.length;
  showFact(list[factIdx]);
}

// Wechseltakt des Fun-Fact-Bands, im Admin einstellbar (30–300 s)
let funfactMs = 30000;
let funfactTimer = null;

function rotateFact() {
  const list = currentFactList();
  factIdx = (factIdx + 1) % list.length;
  factEl.style.opacity = '0';
  factTitleEl.style.opacity = '0';
  setTimeout(() => {
    showFact(list[factIdx]);
    factEl.style.opacity = '1';
    factTitleEl.style.opacity = '1';
  }, 400);
}

function applyFunfactSpeed(seconds) {
  const ms = Math.round((Number(seconds) || 30) * 1000);
  if (ms === funfactMs && funfactTimer) return;
  funfactMs = ms;
  if (funfactTimer) clearInterval(funfactTimer);
  funfactTimer = setInterval(rotateFact, funfactMs);
}

applyFunfactSpeed(30);
</script>
</body>
