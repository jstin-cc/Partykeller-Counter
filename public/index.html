<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SV Partykeller – Anmeldung</title>
<script>document.documentElement.dataset.area = location.pathname.startsWith('/youngstars') ? 'youngstars' : 'partykeller';</script>
<link rel="icon" href="assets/cones-flat.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#010f05">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/theme.css">
<script src="js/vt.js" data-seite="anmeldung"></script>
<link rel="expect" href="#vt-bereit" blocking="render">
<style>
  /* Anmeldeliste (D-044): eine Glas-Tafel, die Konten als Zeilen mit
     Haarlinie dazwischen — statt einer Kachel je Konto */
  .user-list {
    background: var(--surface);
    backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border: 1px solid var(--glass-edge);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .user-list > div + div { border-top: 1px solid var(--glass-edge); }
  .user-row {
    display: flex;
    align-items: center;
    gap: 14px;
    background: transparent;
    border: none;
    padding: 13px 16px;
    cursor: pointer;
    text-align: left;
    width: 100%;
    font-family: 'Work Sans', sans-serif;
  }
  .user-row:hover { background: var(--surface-2); }
  .pin-row { display: flex; gap: 8px; padding: 0 16px 14px 16px; }
  .input-flat {
    background: var(--surface-2);
    backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border: 1px solid var(--glass-edge);
    border-radius: var(--radius);
    padding: 13px 16px;
    color: var(--ink);
    font-size: 16px;
    width: 100%;
  }
  .btn-green {
    background: var(--green);
    color: var(--bg);
    border: none;
    border-radius: var(--radius);
    font-weight: 700;
    cursor: pointer;
    font-family: 'Work Sans', sans-serif;
  }
  .error-banner {
    background: oklch(0.3 0.1 38 / 0.4);
    color: var(--ink);
    border-radius: var(--radius);
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="screen">
  <div class="watermark"></div>

  <div class="screen-inner vt-inhalt" style="gap:22px;">

    <!-- Kopf wie auf allen Seiten (D-080): Zurück links, Logos mittig, Titel darunter -->
    <div style="display:flex;flex-direction:column;gap:12px;">
      <header class="kopf">
        <a class="kopf-zurueck" href="/">‹ Bereich</a>
        <div class="kopf-logos">
          <img src="assets/logo.png" alt="SV Partykeller" class="kopf-logo">
          <img src="assets/youngstars-logo.png" alt="Youngstars" class="ys-logo">
        </div>
        <span></span>
      </header>
      <h1 class="kopf-titel">Anmeldung</h1>
    </div>

    <div id="error-banner" class="error-banner" hidden></div>

    <div class="vt-stufe">
      <div class="sec" style="margin-bottom:12px;"><span class="sec-title">Dein Konto</span></div>
      <div id="user-list" class="user-list"></div>
      <script>
        // Rückweg aus dem Dashboard (D-080, P4): Die eigene Zeile steht schon
        // im ersten Bild, damit der Namenskreis in sie zurückgleiten kann.
        // Die echte Liste ersetzt sie, sobald sie geladen ist.
        (() => {
          try {
            const von = JSON.parse(sessionStorage.getItem('vt-von'));
            if (!von || von.seite !== 'dashboard' || Date.now() - von.t > 8000) return;
            const k = document.documentElement.dataset.area === 'youngstars' ? 'ys' : 'pk';
            const name = localStorage.getItem(`${k}_player_name`);
            if (!name) return;
            const list = document.getElementById('user-list');
            list.innerHTML = '<div style="display:flex;flex-direction:column;"><button type="button" class="user-row">'
              + '<div class="avatar" data-vt-spiegel="dashboard:me-avatar"></div>'
              + '<div style="flex:1;font-size:16px;font-weight:600;color:var(--ink);"><span data-vt-spiegel="dashboard:me-name"></span></div>'
              + '<div style="color:var(--green);font-size:20px;">›</div></button></div>';
            list.querySelector('.avatar').textContent = name.charAt(0).toUpperCase();
            list.querySelector('span').textContent = name;
          } catch { /* dann eben ohne Rückflug */ }
        })();
      </script>
      <div id="list-empty" hidden style="color:var(--ink-muted);font-size:14px;">Noch niemand da – leg unten los.</div>
    </div>

    <div class="vt-stufe" style="display:flex;align-items:center;gap:12px;color:var(--ink-muted);font-size:13px;">
      <div style="flex:1;height:1px;background:oklch(0.95 0.01 95 / 0.15);"></div>
      Registrieren
      <div style="flex:1;height:1px;background:oklch(0.95 0.01 95 / 0.15);"></div>
    </div>

    <form id="create-form" class="vt-stufe" style="display:flex;flex-direction:column;gap:10px;">
      <input id="create-name" class="input-flat" type="text" maxlength="24" placeholder="Dein Name" autocomplete="off" required>
      <input id="create-pin" class="input-flat" type="password" inputmode="numeric" pattern="\d{4}" maxlength="4" placeholder="PIN (optional, 4 Ziffern)" autocomplete="off">
      <button class="btn-green" style="padding:15px;font-size:16px;margin-top:4px;">Konto erstellen &amp; los</button>
    </form>

    <div class="vt-stufe" style="display:flex;justify-content:center;gap:22px;margin-top:auto;padding-top:12px;">
      <a href="abende" data-vt-titel style="font-size:13px;text-decoration:none;">Abend-Archiv</a>
      <a href="admin" style="font-size:13px;text-decoration:none;">Admin-Zugang</a>
    </div>
  </div>

  <img src="assets/footer-woods.png" alt="" class="footer-woods">
</div>
<span id="vt-bereit" hidden></span>

<script type="module">
import { post, fetchPlayers, setSession, getLastPlayerId } from './js/api.js';
import { shake, revealError } from './js/motion.js';

const $ = (id) => document.getElementById(id);
let selectedId = null;

// Übergang ins Dashboard (D-068): Namenskreis und Name der angetippten Zeile
// bekommen die Übergangsnamen, die dort Kopf-Kreis und Kopf-Name tragen — der
// Browser lässt sie beim Seitenwechsel an die neue Stelle gleiten.
function toDashboard(avatar, nameText) {
  avatar.style.viewTransitionName = 'me-avatar';
  nameText.style.viewTransitionName = 'me-name';
  location.href = 'dashboard';
}

// Meldung gleitet ein, das betroffene Feld schüttelt kurz den Kopf (D-079)
function showError(msg, target) {
  const el = $('error-banner');
  el.textContent = msg;
  el.hidden = !msg;
  if (!msg) return;
  el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  revealError(el);
  shake(target);
}

// Im Admin ausgeblendete Konten stehen auch hier nicht mehr in der Auswahl
// (D-037) — angemeldet bleibt, wer schon ein Token auf dem Handy hat.
// Wer sich an diesem Handy zuletzt angemeldet hat, steht oben (D-041): ohne
// Kennzeichnung, die Reihenfolge dahinter bleibt die der Rangliste.
function renderUsers(all) {
  const lastId = getLastPlayerId();
  const players = all.filter((p) => !p.hidden);
  const mine = players.findIndex((p) => p.id === lastId);
  if (mine > 0) players.unshift(players.splice(mine, 1)[0]);
  const list = $('user-list');
  list.textContent = '';
  list.hidden = players.length === 0;   // leere Tafel wäre nur ein Rahmen
  $('list-empty').hidden = players.length > 0;

  for (const p of players) {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;';

    const row = document.createElement('button');
    row.type = 'button';
    row.className = 'user-row';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = p.name.charAt(0).toUpperCase();

    const name = document.createElement('div');
    name.style.cssText = 'flex:1;font-size:16px;font-weight:600;color:var(--ink);';
    const nameText = document.createElement('span');   // nur der Text, für den Übergang
    nameText.textContent = p.name;
    name.append(nameText);

    const chevron = document.createElement('div');
    chevron.style.cssText = 'color:var(--green);font-size:20px;';
    chevron.textContent = '›';

    row.append(avatar, name, chevron);
    wrap.appendChild(row);

    row.addEventListener('click', async () => {
      showError('');
      // Konto ohne PIN (D-018): direkt anmelden, keine Eingabe nötig
      if (!p.hasPin) {
        try {
          const { token, player } = await post('/api/login', { playerId: p.id });
          setSession(token, player.id, player.name);
          toDashboard(avatar, nameText);
        } catch (err) {
          showError(err.message, row);
        }
        return;
      }
      selectedId = p.id;
      renderUsers(players); // schließt andere PIN-Zeilen
    });

    if (selectedId === p.id) {
      const pinRow = document.createElement('form');
      pinRow.className = 'pin-row';

      const pin = document.createElement('input');
      pin.type = 'password';
      pin.inputMode = 'numeric';
      pin.maxLength = 4;
      pin.placeholder = 'PIN';
      pin.autocomplete = 'off';
      pin.required = true;
      pin.className = 'input-flat';
      pin.style.flex = '1';

      const ok = document.createElement('button');
      ok.className = 'btn-green';
      ok.style.cssText = 'padding:12px 20px;font-size:15px;';
      ok.textContent = 'OK';

      pinRow.append(pin, ok);
      // Falsche PIN: Meldung direkt unter dem Feld statt oben auf der Seite
      const pinErr = document.createElement('div');
      pinErr.className = 'error-banner';
      pinErr.style.margin = '-4px 16px 14px';
      pinErr.hidden = true;
      pinRow.addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          const { token, player } = await post('/api/login', { playerId: p.id, pin: pin.value });
          setSession(token, player.id, player.name);
          toDashboard(avatar, nameText);
        } catch (err) {
          pinErr.textContent = err.message === 'Name oder PIN falsch' ? 'Falsche PIN.' : err.message;
          pinErr.hidden = false;
          revealError(pinErr);
          shake(pinRow);
          pin.value = '';
          pin.focus();
        }
      });
      wrap.append(pinRow, pinErr);
      queueMicrotask(() => pin.focus());
    }

    list.appendChild(wrap);
  }
}

$('create-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    const { token, player } = await post('/api/players', { name: $('create-name').value, pin: $('create-pin').value });
    setSession(token, player.id, player.name);
    // Neues Konto: erst die drei Willkommens-Seiten, dann das Dashboard (D-052)
    location.href = 'onboarding';
  } catch (err) {
    showError(err.message, $('create-form'));
  }
});

// Erst nach dem Seitenübergang neu zeichnen (D-080): Die Liste ersetzt sonst
// die Zeile, in die der Namenskreis gerade zurückgleitet
fetchPlayers()
  .then(async ({ players }) => { await window.vtFertig; renderUsers(players); })
  .catch(() => showError('Server nicht erreichbar.'));
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
