<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SV Partykeller – Abend-Archiv</title>
<script>document.documentElement.dataset.area = location.pathname.startsWith('/youngstars') ? 'youngstars' : 'partykeller';</script>
<link rel="icon" href="assets/cones-flat.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#010f05">
<meta name="color-scheme" content="dark">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/theme.css">
<script src="js/vt.js" data-seite="abende"></script>
<style>
  .archive-watermark {
    position: fixed; right: -200px; top: -160px; width: 700px; height: 700px;
    opacity: 0.16; transform: rotate(20deg);
    background: url('assets/zapfen-bg.svg') no-repeat center / contain;
    pointer-events: none;
    z-index: 0;
  }
  /* Handy: Zapfen an derselben Stelle wie auf Anmeldung und Dashboard —
     er bleibt beim Seitenwechsel stehen (D-080, P1) */
  @media (max-width: 760px) {
    .archive-watermark { right: -150px; top: auto; bottom: 60px; width: 480px; height: 480px; opacity: 0.22; transform: rotate(-12deg); }
  }
  .arch-actions { display: flex; justify-content: flex-end; align-items: center; gap: 14px; flex-wrap: wrap; }
  .arch-actions:not(:has(> :not([hidden]))) { display: none; }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .night-card {
    background: var(--surface);
    backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border: 1px solid var(--glass-edge);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .night-date {
    font-family: 'Bitter', serif;
    font-weight: 800;
    font-size: 21px;
    color: var(--creme);
  }
  .night-weekday {
    font-size: 13px;
    color: var(--ink-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  /* Sieger als Zeile über einer Haarlinie, kein Kästchen in der Karte (D-044) */
  .night-winner {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 0 10px;
    border-bottom: 1px solid var(--glass-edge);
  }
  .night-winner .name { font-family:'Bitter',serif; font-weight:700; font-size:17px; color:var(--gold); flex:1; }
  .night-winner .count { font-family:'Bitter',serif; font-weight:700; font-size:15px; color:var(--ink-muted); font-variant-numeric:tabular-nums; }
  .night-stats {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-variant-numeric: tabular-nums;
  }
  .night-stats .cell { text-align: center; flex: 1; }
  .night-stats .value { font-family:'Bitter',serif; font-weight:800; font-size:22px; }
  .night-stats .label { font-size: 11px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }
  .night-meta { font-size: 13px; color: var(--ink-muted); display:flex; justify-content:space-between; }
  /* Vom Admin vergebener Abend-Name (D-028) – steht über dem Datum */
  .night-name {
    font-family: 'Bitter', serif; font-weight: 700; font-size: 15px;
    color: var(--gold); margin-top: 2px;
  }

  /* Admin: der Name ist der Knopf zum Benennen (D-077) */
  .name-edit {
    display: inline-flex; align-items: center; gap: 6px; align-self: flex-start;
    background: none; border: none; padding: 0; cursor: pointer; text-align: left;
  }
  .name-edit svg { width: 13px; height: 13px; flex: none; opacity: 0.55; }
  .name-edit:hover svg { opacity: 1; }
  .name-edit.empty { color: var(--ink-muted); font-weight: 600; font-size: 13px; }
  .name-edit.empty:hover { color: var(--gold); }

  /* Verlauf des Abends (D-029): Kurve über die Stunden, alle Getränke zusammen */
  .night-chart { display: flex; flex-direction: column; gap: 5px; }
  .night-chart .chart-head {
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  }
  .night-chart .chart-head .what {
    font-size: 11px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.06em;
  }
  .night-chart .chart-head .peak {
    font-family: 'Bitter', serif; font-weight: 700; font-size: 12px; color: var(--gold);
    font-variant-numeric: tabular-nums;
  }
  /* Die Fläche wird ungleichmäßig auf die Kartenbreite gezogen; damit die
     Linie dabei nicht mitverzerrt, hängt ihre Stärke an non-scaling-stroke. */
  .night-chart svg { width: 100%; height: 56px; display: block; overflow: visible; }
  .night-chart .area { fill: var(--green); opacity: 0.16; }
  .night-chart .line {
    fill: none; stroke: var(--green); stroke-width: 2;
    stroke-linejoin: round; stroke-linecap: round;
    vector-effect: non-scaling-stroke;
  }
  .night-chart .base { stroke: var(--glass-edge); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .night-chart .peak-mark {
    stroke: var(--gold); stroke-width: 1; stroke-dasharray: 2 3;
    vector-effect: non-scaling-stroke; opacity: 0.75;
  }
  .night-chart .plot { position: relative; }
  /* Der Punkt auf der Spitze sitzt als HTML-Element über der Fläche: ein
     <circle> würde vom ungleichmäßigen Skalieren zur Ellipse verzogen. */
  .night-chart .peak-dot {
    position: absolute; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px;
    border-radius: 50%; background: var(--gold);
    pointer-events: none;
  }
  .night-chart .hit { fill: transparent; }
  .night-chart .axis {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--ink-muted); font-variant-numeric: tabular-nums;
  }

  /* Abend benennen: eigenes kleines Fenster, nur für Admins (D-076) */
  .name-row { display: flex; gap: 8px; align-items: stretch; }
  .name-row .field { font-size: 16px; padding: 10px 12px; }

  /* Admin-Werkzeuge je Abend: CSV-Download, Protokoll, auf dem TV zeigen */
  .night-actions { display: flex; gap: 8px; margin-top: 2px; flex-wrap: wrap; }
  .night-btn {
    flex: 1;
    background: var(--surface-2); border: 1px solid var(--glass-edge); color: var(--ink-muted);
    border-radius: var(--radius); padding: 9px 12px; font-weight: 600; font-size: 13px;
    cursor: pointer; font-family: 'Work Sans', sans-serif;
  }
  a.night-btn { display: flex; align-items: center; justify-content: center; text-align: center; text-decoration: none; }
  a.night-btn:hover { color: var(--ink); }
  .night-btn.on-tv { background: var(--green); color: var(--bg); border-color: var(--green); }
  .modal-backdrop {
    position: fixed; inset: 0; background: var(--scrim);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center; z-index: 10; padding: 20px;
  }
  .edit-card {
    background: var(--surface); border-radius: var(--radius-lg);
    padding: 24px; width: 100%; max-width: 520px; max-height: 86vh;
    display: flex; flex-direction: column; gap: 14px;
  }
  /* Kurze Fehlermeldung, die auch ohne offenes Modal sichtbar ist */
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--glass-edge);
    border-left: 3px solid var(--brick); border-radius: var(--radius);
    padding: 12px 18px; font-size: 14px; color: var(--creme); z-index: 20;
    backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
  }
  .toast.ok { border-left-color: var(--green); }
  .link-btn { background: none; border: none; color: var(--ink-muted); font-size: 14px; text-decoration: underline; cursor: pointer; font-family: 'Work Sans', sans-serif; }
</style>
</head>
<body>
<div style="min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden;">
  <div class="archive-watermark"></div>

  <div class="vt-inhalt" style="max-width:1100px;margin:0 auto;width:100%;padding:20px 24px 0 24px;position:relative;z-index:1;flex:1;">
    <!-- Kopf wie auf allen Seiten (D-080): Zurück links, Logos mittig, Titel darunter -->
    <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:24px;">
      <header class="kopf">
        <a id="back" class="kopf-zurueck" href="./">‹ Zurück</a>
        <div class="kopf-logos">
          <img src="assets/logo.png" alt="SV Partykeller" class="kopf-logo">
          <img src="assets/youngstars-logo.png" alt="Youngstars" class="ys-logo">
        </div>
        <span></span>
      </header>
      <h1 class="kopf-titel">Abend-Archiv</h1>
      <div class="arch-actions">
        <button id="tv-live" class="night-btn" hidden style="flex:none;">TV zurück zur Live-Ansicht</button>
        <button id="export-all" class="night-btn" hidden style="flex:none;">⬇ Alle Abende als CSV</button>
      </div>
    </div>

    <div id="empty" hidden style="text-align:center;margin-top:60px;color:var(--ink-muted);font-size:16px;">
      Noch keine Abende aufgezeichnet – der erste Schluck legt los.
    </div>
    <div id="cards" class="cards vt-stufe"></div>

    <!-- Ältere Abende stehen schon im Speicher, werden aber erst auf Wunsch
         gezeichnet (D-042): jede Karte bringt ein eigenes SVG mit. -->
    <div id="more-wrap" hidden style="display:flex;justify-content:center;margin-top:22px;">
      <button id="more" class="night-btn" type="button" style="flex:none;"></button>
    </div>
  </div>

  <img src="assets/footer-woods.png" alt="" class="footer-woods" style="margin-top:24px;">
</div>

<div id="toast" class="toast" hidden></div>

<!-- Modal: Abend benennen (nur Admin, D-028). Getränke korrigiert der Admin
     seit D-076 im Getränke-Protokoll, nicht mehr hier. -->
<div id="edit-modal" class="modal-backdrop" hidden>
  <div class="glass edit-card">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
      <h2 style="font-family:'Bitter',serif;font-weight:800;font-size:22px;color:var(--creme);margin:0;">Abend benennen: <span id="edit-day-label"></span></h2>
      <button id="close-edit" class="link-btn">Schließen</button>
    </div>
    <div id="edit-error" class="error-msg" style="min-height:0;"></div>
    <div>
      <label for="edit-name-input" class="eyebrow" style="display:block;margin-bottom:6px;">Name des Abends</label>
      <div class="name-row">
        <input id="edit-name-input" class="field" maxlength="40" autocomplete="off"
               placeholder="z. B. Saisonabschluss (leer lassen = kein Name)">
        <button id="save-name" class="night-btn" style="flex:none;">Speichern</button>
      </div>
      <div style="font-size:12px;color:var(--ink-muted);margin-top:6px;">
        Steht auf der Abend-Karte und im TV-Titel, wenn der Abend dort läuft.
      </div>
    </div>
  </div>
</div>

<script type="module">
import { AREA } from './js/area.js';
import { connectState } from './js/ws-client.js';
import { buildCurve } from './js/curve.js';
import { getSession } from './js/api.js';
import { revealError, confirmSaved } from './js/motion.js';

const $ = (id) => document.getElementById(id);

// Wer angemeldet ist, kommt aus dem Dashboard und will dorthin zurück —
// nicht zur Anmeldung (D-054)
if (getSession().token) $('back').href = 'dashboard';
// „‹ Zurück" führt dorthin, wo man herkam (D-080): kam man von einer Seite
// dieses Bereichs, geht es im Verlauf zurück (samt Übergang nach links)
$('back').addEventListener('click', (e) => {
  let ref = null;
  try { ref = new URL(document.referrer); } catch { /* kein Verweis */ }
  if (ref && ref.origin === location.origin && ref.pathname.startsWith(AREA.base + '/') && history.length > 1) {
    e.preventDefault();
    history.back();
  }
});

// Admin-Werkzeuge (Name, Protokoll, TV-Anzeige) erscheinen nur mit Admin-Login aus
// derselben Browser-Session (Token wie in admin.html, bereichsgetrennt D-019)
const adminToken = sessionStorage.getItem(`${AREA.keyPrefix}_admin_token`);
let ws = null;               // WS nur für Admin-Aktionen + Live-Refresh
let board = { mode: null, day: null };
let nights = [];             // aktuelle Archiv-Liste
let editDay = null;          // im Modal geöffneter Party-Tag

function showEditError(message) {
  $('edit-error').textContent = message;
  revealError($('edit-error'));
  setTimeout(() => { $('edit-error').textContent = ''; }, 4000);
}

// Meldung außerhalb des Bearbeiten-Modals (z. B. fehlgeschlagener Download)
let toastTimer = null;
function showToast(message, ok = false) {
  $('toast').textContent = message;
  $('toast').classList.toggle('ok', ok);
  $('toast').hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('toast').hidden = true; }, 4000);
}

function send(msg) {
  ws?.send({ ...msg, token: adminToken });
}

// Übergabedatei holen (nur Admin, D-027). Der Server prüft das Token im
// Authorization-Header, ein einfacher Link könnte den nicht mitschicken —
// deshalb per fetch laden und den Blob über einen Klick-Link speichern.
async function downloadCsv(path, filename) {
  try {
    const res = await fetch(`${AREA.base}/api${path}`, {
      headers: { Authorization: `Bearer ${adminToken}` },
    });
    if (!res.ok) {
      showToast(res.status === 403
        ? 'Download nur mit Admin-Login möglich – bitte neu anmelden.'
        : 'Download fehlgeschlagen.');
      return;
    }
    const url = URL.createObjectURL(await res.blob());
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    // Erst später freigeben: Safari und Firefox lesen die Datei erst nach
    // dem Klick — sofort freigegeben, bricht der Download dort ab (D-084)
    setTimeout(() => URL.revokeObjectURL(url), 30_000);
  } catch {
    showToast('Download fehlgeschlagen.');
  }
}

// Abendrückblick als Bild im Story-Format (D-049). Das Zeichenmodul wird erst
// beim Klick geladen — wer nur im Archiv blättert, holt es gar nicht.
async function saveStory(night, btn) {
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Bild wird erstellt …';
  try {
    const { downloadStory } = await import('./js/story.js');
    await downloadStory(night);
    showToast('Story gespeichert – sie liegt bei deinen Downloads.', true);
  } catch (err) {
    showToast(err.message || 'Story konnte nicht erstellt werden.');
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
}

const WEEKDAYS = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];

// '2026-09-25' -> { date: '25.09.2026', weekday: 'Freitag' }
function fmtDay(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return {
    date: `${String(d).padStart(2, '0')}.${String(m).padStart(2, '0')}.${y}`,
    weekday: WEEKDAYS[new Date(y, m - 1, d).getDay()],
  };
}

const SVG_NS = 'http://www.w3.org/2000/svg';
const hourLabel = (h) => `${((h % 24) + 24) % 24} Uhr`;

// Verlauf des Abends (D-029): Kurve über die Stunden, alle Personen zusammen.
// Der Server liefert nur die Stunden, in denen wirklich etwas passiert ist.
// Die viewBox ist fest (100 x 40) und wird per preserveAspectRatio auf die
// Kartenbreite gezogen — so muss die Breite nie gemessen werden.
function buildChart(timeline) {
  if (!timeline?.counts?.length) return null;
  const { startHour, counts } = timeline;
  const n = counts.length;
  const W = 100, H = 40, PAD_T = 4;   // PAD_T: Luft, damit die Spitze nicht anstößt
  // Kurve wie im Story-Bild — dieselbe Formel liegt in js/curve.js
  const { max, peak, xAt, yAt, d: line } = buildCurve(counts, W, H, PAD_T);

  const el = (name, attrs, cls) => {
    const node = document.createElementNS(SVG_NS, name);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, String(v));
    if (cls) node.setAttribute('class', cls);
    return node;
  };

  const box = document.createElement('div');
  box.className = 'night-chart';

  const head = document.createElement('div');
  head.className = 'chart-head';
  const what = document.createElement('span');
  what.className = 'what';
  what.textContent = 'Verlauf pro Stunde';
  const peakEl = document.createElement('span');
  peakEl.className = 'peak';
  peakEl.textContent = `Spitze ${hourLabel(startHour + peak)}: ${max}`;
  head.append(what, peakEl);

  const svg = el('svg', {
    viewBox: `0 0 ${W} ${H}`,
    preserveAspectRatio: 'none',
    role: 'img',
    'aria-label':
      `Getränke pro Stunde von ${hourLabel(startHour)} bis ${hourLabel(startHour + n)}, Spitze ${max}`,
  });
  svg.append(
    el('path', { d: `${line} L${W} ${H} L0 ${H} Z` }, 'area'),
    el('line', { x1: 0, y1: H, x2: W, y2: H }, 'base'),
    el('path', { d: line }, 'line'),
    el('line', { x1: xAt(peak), y1: yAt(max), x2: xAt(peak), y2: H }, 'peak-mark'),
  );
  // Unsichtbare Streifen je Stunde: nur als Ziel für den Tooltip
  const step = n === 1 ? W : W / (n - 1);
  counts.forEach((v, i) => {
    const x = Math.max(0, xAt(i) - step / 2);
    const hit = el('rect', { x, y: 0, width: Math.min(step, W - x), height: H }, 'hit');
    const title = document.createElementNS(SVG_NS, 'title');
    title.textContent = `${hourLabel(startHour + i)}: ${v === 1 ? '1 Getränk' : `${v} Getränke`}`;
    hit.appendChild(title);
    svg.appendChild(hit);
  });

  const plot = document.createElement('div');
  plot.className = 'plot';
  const dot = document.createElement('span');
  dot.className = 'peak-dot';
  dot.style.left = `${(xAt(peak) / W) * 100}%`;
  dot.style.top = `${(yAt(max) / H) * 100}%`;
  plot.append(svg, dot);

  const axis = document.createElement('div');
  axis.className = 'axis';
  const from = document.createElement('span');
  from.textContent = hourLabel(startHour);
  axis.append(from);
  // Bei nur einer Stunde stünde links und rechts dieselbe Uhrzeit
  if (n > 1) {
    const to = document.createElement('span');
    to.textContent = hourLabel(startHour + n - 1);
    axis.append(to);
  } else {
    axis.style.justifyContent = 'center';
  }

  box.append(head, plot, axis);
  return box;
}

function statCell(value, label, color) {
  const cell = document.createElement('div');
  cell.className = 'cell';
  const v = document.createElement('div');
  v.className = 'value';
  v.style.color = color;
  v.textContent = value;
  const l = document.createElement('div');
  l.className = 'label';
  l.textContent = label;
  cell.append(v, l);
  return cell;
}

function buildCard(night) {
  const { date, weekday } = fmtDay(night.day);
  const card = document.createElement('div');
  card.className = 'night-card';
  card.id = `night-${night.day}`;   // Sprungziel beim Nachladen (D-042)

  const head = document.createElement('div');
  const wd = document.createElement('div');
  wd.className = 'night-weekday';
  wd.textContent = weekday;
  const dt = document.createElement('div');
  dt.className = 'night-date';
  dt.textContent = date;
  head.append(wd, dt);
  // Vom Admin vergebener Name (D-028) – steht unter dem Datum, falls gesetzt.
  // Für den Admin ist er zugleich der Knopf zum Benennen (D-077); ohne Namen
  // steht dort leise „Namen geben“.
  if (adminToken) {
    const nm = document.createElement('button');
    nm.type = 'button';
    nm.className = 'night-name name-edit' + (night.name ? '' : ' empty');
    nm.textContent = night.name || 'Namen geben';
    nm.title = night.name ? 'Namen ändern' : 'Diesem Abend einen Namen geben';
    nm.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>');
    nm.addEventListener('click', () => openEdit(night.day));
    head.appendChild(nm);
  } else if (night.name) {
    const nm = document.createElement('div');
    nm.className = 'night-name';
    nm.textContent = night.name;
    head.appendChild(nm);
  }

  const winner = document.createElement('div');
  winner.className = 'night-winner';
  if (night.winner) {
    const crown = document.createElement('span');
    crown.textContent = '👑';
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = night.winner.name;
    const count = document.createElement('span');
    count.className = 'count';
    count.textContent = `${night.winner.total} Getränke`;
    winner.append(crown, name, count);
  } else {
    winner.textContent = '—';
  }

  const stats = document.createElement('div');
  stats.className = 'night-stats';
  stats.append(
    statCell(night.beers, 'Bier', 'var(--amber)'),
    statCell(night.shots, 'Shots', 'var(--brick)'),
    statCell(night.mixes, 'Mischen', 'var(--mix)'),
    statCell(night.total, 'Gesamt', 'var(--gold)'),
  );

  const meta = document.createElement('div');
  meta.className = 'night-meta';
  const part = document.createElement('span');
  part.textContent = night.participants === 1 ? '1 Teilnehmer' : `${night.participants} Teilnehmer`;
  meta.append(part);

  card.append(head, winner, stats);
  const chart = buildChart(night.timeline);
  if (chart) card.appendChild(chart);
  card.appendChild(meta);

  // Story kann jeder speichern — eigene Zeile, damit die Admin-Werkzeuge
  // darunter so breit bleiben wie bisher
  const shareRow = document.createElement('div');
  shareRow.className = 'night-actions';
  const story = document.createElement('button');
  story.className = 'night-btn';
  story.title = `Abendrückblick vom ${date} als Bild fürs Handy`;
  story.textContent = '⬇ Story';
  story.addEventListener('click', () => saveStory(night, story));
  shareRow.appendChild(story);
  card.appendChild(shareRow);

  // Übergabedatei, Name, Protokoll und TV-Anzeige bleiben dem Admin vorbehalten
  if (adminToken) {
    const actions = document.createElement('div');
    actions.className = 'night-actions';

    const csv = document.createElement('button');
    csv.className = 'night-btn';
    csv.title = `Teilnehmerliste vom ${date} als CSV`;
    csv.textContent = '⬇ CSV';
    csv.addEventListener('click', () =>
      downloadCsv(`/export/archive/${night.day}`, `${AREA.id}-abend-${night.day}.csv`));
    actions.appendChild(csv);

    // Getränke dieses Abends einzeln korrigieren: im Getränke-Protokoll (D-076)
    const log = document.createElement('a');
    log.className = 'night-btn';
    log.href = `admin?protokoll=${night.day}`;
    log.textContent = 'Protokoll';
    log.title = 'Getränke dieses Abends einzeln ansehen und korrigieren';
    const tv = document.createElement('button');
    tv.className = 'night-btn';
    const onTv = board.mode === 'archive' && board.day === night.day;
    tv.classList.toggle('on-tv', onTv);
    tv.textContent = onTv ? '✓ Auf dem TV' : 'Auf den TV';
    tv.title = onTv ? 'Dieser Abend läuft gerade auf dem TV' : 'Diesen Abend auf dem TV zeigen';
    tv.addEventListener('click', () => send({ type: 'setBoardMode', mode: 'archive', day: night.day }));
    actions.append(log, tv);
    card.appendChild(actions);
  }
  return card;
}

// Wie viele Abende gerade gezeichnet sind. Die Liste kommt komplett vom
// Server (60 Abende sind rund 11 KB), teuer ist erst das Zeichnen: jede Karte
// bringt eine eigene SVG-Kurve mit. Darum in Blöcken (D-042).
const PAGE = 12;
let shown = PAGE;

function renderCards() {
  const box = $('cards');
  box.textContent = '';
  $('empty').hidden = nights.length > 0;
  const visible = nights.slice(0, shown);
  for (const night of visible) box.appendChild(buildCard(night));

  const rest = nights.length - visible.length;
  $('more-wrap').hidden = rest <= 0;
  if (rest > 0) {
    const next = Math.min(PAGE, rest);
    $('more').textContent = rest === 1
      ? 'Einen älteren Abend laden'
      : `${next} ältere Abende laden (noch ${rest})`;
  }

  $('tv-live').hidden = !(adminToken && board.mode === 'archive');
  // Übergabedatei über alle Abende: nur als Admin und nur wenn es Abende gibt
  $('export-all').hidden = !adminToken || nights.length === 0;
}

$('more').addEventListener('click', () => {
  const first = nights.length > shown ? nights[shown].day : null;
  shown += PAGE;
  renderCards();
  // Nach dem Nachzeichnen zur ersten neuen Karte springen, sonst steht man
  // weiter oben und sieht nicht, dass etwas passiert ist.
  if (first) document.getElementById(`night-${first}`)?.scrollIntoView({ block: 'start', behavior: 'smooth' });
});

async function load() {
  const res = await fetch(`${AREA.base}/api/archive`);
  ({ days: nights } = await res.json());
  renderCards();
}

// --- Abend benennen (Admin) ---
function openEdit(day) {
  editDay = day;
  $('edit-day-label').textContent = fmtDay(day).date;
  $('edit-error').textContent = '';
  // Name nur beim Öffnen setzen: spätere State-Broadcasts sollen nicht in ein
  // Feld schreiben, in dem gerade getippt wird.
  $('edit-name-input').value = nights.find((n) => n.day === day)?.name ?? '';
  $('edit-modal').hidden = false;
  $('edit-name-input').focus();
}

// Abend benennen (D-028); leeres Feld entfernt den Namen wieder
function saveNightName() {
  if (!editDay) return;
  const name = $('edit-name-input').value.trim();
  send({ type: 'setNightName', day: editDay, name });
  editDay = null;   // kein zweites Senden, während der Haken läuft
  // erst den Haken im Knopf zeigen, dann schließen (D-079)
  confirmSaved($('save-name'), { ms: 700, label: name ? 'Gespeichert' : 'Entfernt' }).then(() => {
    showToast(name ? 'Name gespeichert.' : 'Name entfernt.', true);
    closeEdit();
  });
}
function closeEdit() { $('edit-modal').hidden = true; editDay = null; }

$('export-all').addEventListener('click', () =>
  downloadCsv('/export/archive', `${AREA.id}-abende-gesamt.csv`));
$('save-name').addEventListener('click', saveNightName);
$('edit-name-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') saveNightName(); });
$('close-edit').addEventListener('click', closeEdit);
$('tv-live').addEventListener('click', () => send({ type: 'setBoardMode', mode: 'alltime' }));

// Admin: über den State-Broadcast bleiben TV-Status und Abend-Namen aktuell
if (adminToken) {
  ws = connectState({
    onState(state) {
      board = { mode: state.boardMode ?? 'alltime', day: state.boardDay ?? null };
      load();   // Archiv-Liste ändert sich durch neue Getränke und Namen
    },
    onError: showEditError,
  });
} else {
  load();
}
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
